<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examen de Operación — Bolsas Delta</title>
<style>
:root{--navy:#1F3864;--red:#C00000;--bg:#f3f5f9;--card:#fff;--line:#d9dee8;--txt:#1b2230;--mut:#5b6577;
--rojo:#C00000;--amarillo:#F1C232;--verde:#38761D;--azul:#1F3864}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.45}
#app{max-width:860px;margin:0 auto;padding:12px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0}
h1{font-size:1.45rem;margin:0 0 4px;color:var(--navy)}h2{font-size:1.15rem;margin:0 0 8px;color:var(--navy)}
.sub{color:var(--mut);margin:0 0 12px}.tag{display:inline-block;font-size:.75rem;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.04em}
label.f{display:block;font-weight:600;margin:12px 0 4px;font-size:.92rem}
input[type=text],select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--txt)}
textarea{resize:vertical}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px 18px;background:var(--navy);color:#fff;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.ghost{background:#e8ecf4;color:var(--navy)}.btn.danger{background:#fbe3e3;color:var(--red)}.btn.small{padding:6px 12px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem;color:var(--mut);padding:6px 2px}
.prog{height:8px;background:#dfe4ee;border-radius:99px;overflow:hidden}.prog>div{height:100%;background:var(--navy);transition:width .25s}
.q{padding:14px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}
.qt{font-weight:650;margin:0 0 8px}
.qimg{display:block;max-width:100%;max-height:320px;margin:0 0 10px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;object-fit:contain;background:#fafafa}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:11px 12px;margin:7px 0;cursor:pointer;background:#fff}
.opt:hover{border-color:#9fb0cf}.opt.on{border-color:var(--navy);background:#eef2fb}
.opt input{margin-top:4px;accent-color:var(--navy);transform:scale(1.2)}
.opt .oi{max-width:140px;max-height:110px;border-radius:6px;border:1px solid var(--line);display:block;margin-bottom:6px;cursor:zoom-in;object-fit:contain}
.chip{display:inline-block;min-width:78px;text-align:center;padding:3px 10px;border-radius:99px;font-weight:700;font-size:.82rem}
.chip.rojo{background:var(--rojo);color:#fff}.chip.amarillo{background:var(--amarillo);color:#3b2f00}.chip.verde{background:var(--verde);color:#fff}.chip.azul{background:var(--azul);color:#fff}.chip.gris{background:#9aa3b5;color:#fff}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:middle}th{color:var(--mut);font-size:.78rem;text-transform:uppercase}
.ok{background:#e6f4ea;color:#14532d;padding:10px 12px;border-radius:8px}.warn{background:#fff4d6;color:#6b4e00;padding:10px 12px;border-radius:8px}.bad{background:#fde7e7;color:#8a1111;padding:10px 12px;border-radius:8px}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.sum div{flex:1;min-width:90px;text-align:center;border-radius:10px;padding:10px;font-weight:700}
.sum small{display:block;font-weight:500;opacity:.9}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0}.kv b{color:var(--mut);font-weight:600}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:12px}
#lightbox[hidden]{display:none}#lightbox img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
/* editor */
.ed{display:grid;grid-template-columns:310px 1fr;gap:12px;align-items:start}
@media(max-width:860px){.ed{grid-template-columns:1fr}}
#sb{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;max-height:78vh;overflow:auto;position:sticky;top:8px}
.sb-t{font-size:.72rem;font-weight:800;color:var(--mut);text-transform:uppercase;padding:6px 8px}
.sb-x{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:12px;height:12px;border-radius:99px;flex:none;border:1px solid rgba(0,0,0,.15)}
.sb-x .cnt{margin-left:auto}.warnc{color:#a15c00;font-weight:700}.okc{color:#2e7d32;font-weight:700}
.sb-b{font-weight:800;color:var(--red);font-size:.74rem;text-transform:uppercase;padding:10px 8px 4px;cursor:pointer}
.sb-h{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.88rem;display:flex;justify-content:space-between;gap:6px}
.sb-q{padding:4px 8px 4px 22px;border-radius:6px;cursor:pointer;font-size:.8rem;color:var(--mut)}
.sb-x.on,.sb-b.on,.sb-h.on,.sb-q.on{background:#e3eafa;color:var(--navy)}.cnt{color:var(--mut);font-size:.8rem}
.oe{display:grid;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fafbfd}
.imgc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.imgc .thumb{max-height:70px;max-width:110px;border:1px solid var(--line);border-radius:6px}
.imgc input[type=text]{flex:1;min-width:160px;padding:6px 10px;font-size:.85rem}
.okl{font-weight:600;font-size:.88rem;display:flex;gap:6px;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}.tabs .btn{border-radius:8px 8px 0 0}
.tabs .btn.on{background:var(--navy);color:#fff}.tabs .btn:not(.on){background:#e8ecf4;color:var(--navy)}
td input[type=text],td select{padding:6px 8px;font-size:.88rem}
.scroll{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
canvas#qr{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Examen de Operación — Bolsas Delta","examenes":{"TRIUNFO":{"color":"#92D050","bloques":[{"titulo":"B1 · NÚCLEO COMÚN – TODAS LAS MÁQUINAS","habilidades":[{"id":"H01","nombre":"Conocimiento de máquina (capacidades)","preguntas":[{"id":"H01-P1","q":"¿Por qué debes conocer la capacidad (rangos de medida y velocidad) de tu máquina antes de arrancar una orden?","img":"","opts":[{"t":"Para confirmar que la medida de la orden está dentro de lo que la máquina puede fabricar","img":""},{"t":"Porque es un requisito del arranque de turno, aunque no cambia nada","img":""},{"t":"Para calcular cuántas bolsas se producirán en el turno","img":""}],"c":0,"fijo":false},{"id":"H01-P2","q":"Llega una orden con un ancho de bolsa mayor al máximo de tu máquina. ¿Qué haces?","img":"","opts":[{"t":"Abro el formador al máximo e intento correrla","img":""},{"t":"Aviso al supervisor para que la orden se reasigne a una máquina con capacidad","img":""},{"t":"La corro a menor velocidad para compensar la diferencia","img":""}],"c":1,"fijo":false},{"id":"H01-P3","q":"Si se trabaja la máquina por encima de la velocidad recomendada para ese papel y medida, lo más probable es:","img":"","opts":[{"t":"Más producción sin afectar la calidad, porque la máquina se autoajusta","img":""},{"t":"Más merma por pegado deficiente y cortes irregulares, y desgaste prematuro de piezas","img":""},{"t":"Que la máquina se detenga sola sin ninguna consecuencia","img":""}],"c":1,"fijo":false}]},{"id":"H02","nombre":"Cambio de rollo","preguntas":[{"id":"H02-P1","q":"Antes de cambiar el rollo de papel, lo primero que debes hacer es:","img":"","opts":[{"t":"Retirar el rollo vacío mientras termina de girar","img":""},{"t":"Cortar el papel con la máquina en marcha lenta","img":""},{"t":"Detener la máquina y asegurarte de que no haya partes en movimiento","img":""}],"c":2,"fijo":false},{"id":"H02-P2","q":"Al montar el rollo nuevo, ¿qué debes verificar contra la orden?","img":"","opts":[{"t":"Gramaje, ancho, tipo de papel y que la impresión sea el diseño correcto","img":""},{"t":"Solo que el diámetro sea grande para que dure más","img":""},{"t":"Solo que el color del papel sea el mismo","img":""}],"c":0,"fijo":false},{"id":"H02-P3","q":"Después de un empalme de rollo, las bolsas salen con la impresión desfasada. ¿Qué es lo correcto?","img":"","opts":[{"t":"Dejar correr y empacar todo; el desfase desaparece después de unas bolsas","img":""},{"t":"Revisar tensión y registro de impresión, y separar las bolsas que traen el empalme","img":""},{"t":"Subir la velocidad para que el registro se acomode solo","img":""}],"c":1,"fijo":false}]},{"id":"H03","nombre":"Cambio de formador","preguntas":[{"id":"H03-P1","q":"¿Qué función tiene el formador?","img":"","opts":[{"t":"Cortar la bolsa a la longitud de la orden","img":""},{"t":"Aplicar el adhesivo del fondo","img":""},{"t":"Darle al papel la forma de tubo con el ancho y fuelle de la bolsa","img":""}],"c":2,"fijo":false},{"id":"H03-P2","q":"Al cambiar el formador para una nueva medida, ¿qué debe coincidir?","img":"","opts":[{"t":"El formador con la medida de la orden anterior, para no mover ajustes","img":""},{"t":"Solo el ancho; el fuelle se corrige después con el prensado","img":""},{"t":"El ancho y el fuelle del formador con las medidas de la orden","img":""}],"c":2,"fijo":false},{"id":"H03-P3","q":"Después del cambio de formador, la costura lateral del tubo sale irregular (abre y cierra). La causa más probable es:","img":"","opts":[{"t":"El formador quedó descentrado o el papel no entra alineado a él","img":""},{"t":"El adhesivo lateral es de un código autorizado","img":""},{"t":"La velocidad de las bandas de salida es baja","img":""}],"c":2,"fijo":false}]},{"id":"H04","nombre":"Cambio completo autónomo","preguntas":[{"id":"H04-P1","q":"¿Qué significa hacer un cambio completo de forma autónoma?","img":"","opts":[{"t":"Preparar la máquina y esperar a que mantenimiento haga el cambio","img":""},{"t":"Hacer todo el cambio de medida (formador, cuchillas, ajustes y prueba) sin ayuda","img":""},{"t":"Cambiar solo el rollo de papel sin ayuda","img":""}],"c":1,"fijo":false},{"id":"H04-P2","q":"Al terminar un cambio completo, antes de producir en serie, debes:","img":"","opts":[{"t":"Correr bolsas de prueba y verificar medidas y calidad contra la orden","img":""},{"t":"Empacar las primeras bolsas y revisar solo si calidad lo pide","img":""},{"t":"Arrancar directo a velocidad normal y revisar en la primera tarima","img":""}],"c":0,"fijo":false},{"id":"H04-P3","q":"¿Qué práctica reduce más el tiempo de un cambio completo?","img":"","opts":[{"t":"Parar la máquina y después buscar herramientas y piezas","img":""},{"t":"Preparar herramientas, piezas y material antes de parar la máquina","img":""},{"t":"Hacer el cambio por partes entre varios turnos","img":""}],"c":1,"fijo":false}]},{"id":"H05","nombre":"Uso de herramientas","preguntas":[{"id":"H05-P1","q":"Al terminar de usar una herramienta, debes:","img":"","opts":[{"t":"Dejarla sobre la máquina para el siguiente ajuste","img":""},{"t":"Guardarla en tu casillero para que no se pierda","img":""},{"t":"Regresarla limpia a su lugar asignado","img":""}],"c":2,"fijo":false},{"id":"H05-P2","q":"Para apretar un tornillo de medida específica, lo correcto es usar:","img":"","opts":[{"t":"La llave de la medida exacta","img":""},{"t":"Unas pinzas de presión bien ajustadas","img":""},{"t":"Una llave más grande, apretando con cuidado","img":""}],"c":0,"fijo":false},{"id":"H05-P3","q":"¿Por qué nunca debes dejar una herramienta sobre la máquina al arrancarla?","img":"","opts":[{"t":"Porque se ensucia de adhesivo","img":""},{"t":"Puede caer en partes en movimiento, dañar la máquina y lesionar a alguien","img":""},{"t":"Porque se puede perder y hay que reponerla","img":""}],"c":1,"fijo":false}]},{"id":"H06","nombre":"Identificación de refacciones","preguntas":[{"id":"H06-P1","q":"¿Qué es una refacción?","img":"","opts":[{"t":"Una pieza de repuesto para sustituir una parte dañada o desgastada","img":""},{"t":"Una herramienta especial de ajuste","img":""},{"t":"Una pieza que se queda de stock para ver cuando la podre necesitar","img":""}],"c":0,"fijo":false},{"id":"H06-P2","q":"Notas una pieza desgastada pero la máquina sigue trabajando. Lo correcto es:","img":"","opts":[{"t":"Esperar a que se rompa para cambiarla","img":""},{"t":"Reportarla para programar su cambio antes de que falle","img":""},{"t":"Hacerle una reparacion temporal","img":""}],"c":1,"fijo":false},{"id":"H06-P3","q":"Para pedir una refacción al almacén o a mantenimiento, lo más útil es dar:","img":"","opts":[{"t":"El nombre correcto de la pieza, la máquina y su número o código","img":""},{"t":"Una descripción general, como 'la pieza de en medio del fondo'","img":""},{"t":"El nombre de la pieza más parecida que haya en existencia","img":""}],"c":0,"fijo":false}]},{"id":"H07","nombre":"Ajuste de medidas","preguntas":[{"id":"H07-P1","q":"¿Contra qué se comparan las medidas de la bolsa producida?","img":"","opts":[{"t":"Contra las especificaciones de la orden de trabajo","img":""},{"t":"Contra una bolsa de otra máquina","img":""},{"t":"Contra lo que se recuerde del pedido anterior","img":""}],"c":0,"fijo":false},{"id":"H07-P2","q":"Después de un ajuste de medida, ¿cuántas bolsas conviene medir para confirmarlo?","img":"","opts":[{"t":"Ninguna, si el ajuste se realizo correctamente","img":""},{"t":"Una sola bolsa es suficiente","img":""},{"t":"Varias bolsas seguidas (por ejemplo, de 3 a 5)","img":""}],"c":2,"fijo":false},{"id":"H07-P3","q":"La orden indica tolerancia de ±2 mm y la bolsa mide 3 mm de más. La bolsa está:","img":"","opts":[{"t":"Fuera de especificación; requiere ajuste y separar lo producido","img":""},{"t":"Dentro de especificación, porque la diferencia es menor a medio centímetro","img":""},{"t":"Aceptable si el cliente no lo nota","img":""}],"c":0,"fijo":false}]},{"id":"H08","nombre":"Ajuste de tiempos","preguntas":[{"id":"H08-P1","q":"En la máquina, 'ajustar tiempos' se refiere a:","img":"","opts":[{"t":"Sincronizar las partes para que cada operación ocurra en el momento correcto del ciclo","img":""},{"t":"Ajustar el corte de bolsa solamente","img":""},{"t":"Ajuste de cuantos minutos tiene que correr","img":""}],"c":0,"fijo":false},{"id":"H08-P2","q":"Un síntoma de que los tiempos están desfasados es:","img":"","opts":[{"t":"El papel llega con otro color de impresión","img":""},{"t":"El rollo se termina más rápido de lo normal","img":""},{"t":"El corte, el doblez o el pegado del fondo no caen en la posición correcta","img":""}],"c":2,"fijo":false},{"id":"H08-P3","q":"Antes de mover un ajuste de tiempos, lo correcto es:","img":"","opts":[{"t":"Ajustarlo con la máquina a velocidad normal para ver el efecto real","img":""},{"t":"Marcar la posición original y hacer ajustes pequeños, comprobando con prueba","img":""},{"t":"Mover varias estaciones al mismo tiempo para ganar tiempo","img":""}],"c":1,"fijo":false}]},{"id":"H09","nombre":"Ajuste de avance de tubo","preguntas":[{"id":"H09-P1","q":"El avance de tubo controla:","img":"","opts":[{"t":"Cuánto tubo avanza por ciclo, lo que define el largo de la bolsa","img":""},{"t":"El ancho de la bolsa","img":""},{"t":"La cantidad de adhesivo aplicado","img":""}],"c":0,"fijo":false},{"id":"H09-P2","q":"Si el avance es mayor al requerido, la bolsa saldrá:","img":"","opts":[{"t":"Igual, solo cambia la velocidad","img":""},{"t":"Más larga","img":""},{"t":"Más ancha","img":""}],"c":0,"fijo":false},{"id":"H09-P3","q":"El corte no cae en la marca de registro y se va recorriendo bolsa tras bolsa. Debes revisar:","img":"","opts":[{"t":"La presión de la prensa de salida","img":""},{"t":"El formador y el fuelle","img":""},{"t":"El ajuste de avance y el sensor (fotocelda) de registro","img":""}],"c":2,"fijo":false}]},{"id":"H10","nombre":"Cambio de cuchillas","preguntas":[{"id":"H10-P1","q":"¿Qué equipo de protección es indispensable al manipular c   const n = f.length, aplican = ap ? ap.size : filas.length;
  const cnt = [0, 0, 0, 0]; f.forEach(x => cnt[x.nivel]++);
  let base;
  if (!n) base = 'PENDIENTE';
  else if (f.every(x => x.nivel >= 3)) base = 'OPERADOR ESPECIAL';
  else if (f.every(x => req(x.id) > 2 || x.nivel >= 2)) base = 'OPERADOR';
  else if (f.every(x => req(x.id) > 1 || x.nivel >= 1)) base = 'APRENDIZ';
  else base = 'SIN DOMINIO';
  const parcial = n > 0 && n < aplican;
  const suma = f.reduce((a, x) => a + x.nivel, 0);
  return { nivel: base, parcial, nivel_final: base + (parcial ? ' (parcial)' : ''), evaluadas: n, aplican,
    azul: cnt[3], verde: cnt[2], amarillo: cnt[1], rojo: cnt[0],
    pct_dominio: n ? suma / (3 * n) : null, indice: n ? suma / n + 1 : null,
    brechas: np && n ? f.filter(x => req(x.id) <= np && x.nivel < np).length : null };
}

async function terminar() {

  const res = calcular(), d = estado.datos;

  const corr = res.detalle.filter(x => x.ok).length, sinR = res.detalle.filter(x => x.resp < 0).length, totP = res.detalle.length;
  rf.correctas = corr; rf.incorrectas = totP - corr - sinR; rf.sin_responder = sinR; rf.total = totP;
  const payload = { fecha: new Date().toISOString(), codigo: d.codigo, nombre: (CONFIG.MODO_PRUEBAS && !preview ? '[PRUEBA] ' : '') + d.nombre, prueba: !!CONFIG.MODO_PRUEBAS, sin_calificar: res.sinCal.map(x => x.id), area: d.area, puesto: d.puesto, nivel_puesto: d.nivelPuesto, examen: d.examen, duracion_min: Math.round((new Date() - estado.inicio) / 60000),

  window.onbeforeunload = null;

function csvDe(lista) {
  const cat = catalogo(), q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;

  const filas = lista.map(r => { const m = {}; r.habilidades.forEach(x => m[x.id] = x.nivel); return [r.fecha, r.codigo, r.nombre, r.puesto ?? '', r.area, r.examen, r.duracion_min, r.resultado?.correctas ?? '', r.resultado?.incorrectas ?? '', r.resultado?.nivel_final ?? '', ...cat.map(c => m[c.id] ?? '')].map(q).join(','); });

function comprimir(file, maxW = 1000, q = 0.82) {

    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

    q.opts.length > 2 ? h('div', {}, h('button', { class: 'btn small danger', onclick: () => { q.opts.splice(oi, 1); if (q.c === oi) q.c = null; else if (q.c != null && q.c > oi) q.c--; refresh(); } }, 'Quitar opción')) : null)));
  m.append(h('div', { class: 'card', style: 'margin-top:0' }, h('h2', {}, `${hb.id || ''} ${hb.nombre} — pregunta ${sel.q + 1}`),
    q.c == null ? h('div', { id: 'warnq', class: 'warn', style: 'margin-bottom:8px' }, '⚠ Esta pregunta no tiene respuesta correcta marcada, por eso su habilidad no entra al examen. Marca la opción correcta abajo.') : null,
    h('label', { class: 'f' }, 'Texto de la pregunta'), h('textarea', { rows: 3, oninput: e => { q.q = e.target.value; guardar(); }, onchange: renderSidebar }, q.q),
    h('label', { class: 'f' }, 'Imagen de la pregunta (opcional) — también puedes pegarla con Ctrl+V'), imgControl(q, renderMain),
    h('label', { class: 'f' }, 'Opciones'), opts,
    h('div', { class: 'row' },
      q.opts.length < 5 ? h('button', { class: 'btn small ghost', onclick: () => { q.opts.push({ t: '', img: '' }); refresh(); } }, '+ Opción') : null,
      h('label', { class: 'okl' }, h('input', { type: 'checkbox', checked: !!q.fijo, onchange: e => { q.fijo = e.target.checked; guardar(); } }), 'No mezclar el orden de las opciones')),
    h('div', { class: 'row', style: 'margin-top:16px' },
      h('button', { class: 'btn small ghost', onclick: () => siguienteSinClave(false) }, 'Siguiente sin clave →'),
      h('button', { class: 'btn small ghost', onclick: () => { const c = JSON.parse(JSON.stringify(q)); c.id = nuevaPregunta().id; hb.preguntas.splice(sel.q + 1, 0, c); sel.q++; refresh(); } }, 'Duplicar'),
      h('button', { class: 'btn small danger', onclick: () => { if (confirm('¿Eliminar esta pregunta?')) { hb.preguntas.splice(sel.q, 1); sel = { t: 'h', b: sel.b, h: sel.h }; refresh(); } } }, 'Eliminar pregunta'))));
}
document.addEventListener('paste', async e => {
  if (tab !== 'ex' || !$('#main') || sel.t !== 'q') return;
  const it = [...(e.clipboardData?.items || [])].find(x => x.type.startsWith('image/')); if (!it) return;
  const q = B()[sel.b]?.habilidades[sel.h]?.preguntas[sel.q]; if (!q) return;
  e.preventDefault(); q.img = await comprimir(it.getAsFile()); guardar(); renderMain();
});

/* ---- pestaña Máquinas ---- */
function renderPlantilla(c) {
  const examNames = Object.keys(DATA.examenes);
  const selEx = (val, on) => h('select', { onchange: e => on(e.target.value) }, h('option', { value: '', selected: !val }, '(sin examen: no aparece en el menú)'), examNames.map(n => h('option', { value: n, selected: n === val }, n)));
  const areasT = h('table', {}, h('tr', {}, ['Máquina (opción del menú)', 'Examen que presenta', ''].map(t => h('th', {}, t))),
    Object.keys(DATA.areas).sort(natural).map(a => h('tr', {}, h('td', {}, a), h('td', {}, selEx(DATA.areas[a], v => { DATA.areas[a] = v; guardar(); })),
      h('td', {}, h('button', { class: 'btn small danger', onclick: () => { delete DATA.areas[a]; refresh(); } }, 'Quitar')))));
  const nueva = h('input', { type: 'text', placeholder: 'Nueva máquina (ej. SOBRES E-COMER)' });
  c.append(h('div', { class: 'card' }, h('h2', {}, 'Máquinas del menú'),
    h('p', { class: 'sub' }, 'Al abrir el examen, cada persona elige su puesto y su máquina; aquí decides qué examen (hoja de color) le toca a cada máquina. Las que no tengan examen asignado no aparecen en el menú. No hay plantilla de personal: cualquier persona puede presentarlo.'),
    h('div', { class: 'scroll' }, areasT),
    h('div', { class: 'row', style: 'margin-top:10px' }, nueva, h('button', { class: 'btn small', onclick: () => { const a = nueva.value.trim().toUpperCase(); if (a && !(a in DATA.areas)) { DATA.areas[a] = ''; refresh(); } } }, '+ Máquina'))));
}

/* ---- pestaña Código QR ---- */
function renderQR(c) {
  const url = h('input', { type: 'text', value: DATA.urlPublica || (location.protocol.startsWith('http') ? location.origin + location.pathname : ''), placeholder: 'https://… (la dirección donde publiques este examen)' });
  const titulo = h('input', { type: 'text', value: DATA.tituloQR || 'Escanea para presentar tu examen' });
  const cv = h('canvas', { id: 'qr', width: 640, height: 640 });
  const msg = h('p', { class: 'sub' }, '');
  const dibujar = () => {
    const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 640, 640);
    const u = url.value.trim(); if (!u) { msg.textContent = 'Escribe la dirección web donde estará publicado el examen.'; return false; }
    try {
      const qr = qrcode(0, 'M'); qr.addData(u); qr.make(); const n = qr.getModuleCount(), cell = Math.floor(640 / (n + 8)), off = Math.floor((640 - cell * n) / 2);
      x.fillStyle = '#000'; for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) x.fillRect(off + k * cell, off + r * cell, cell, cell);
      msg.textContent = ''; return true;
    } catch (e) { msg.textContent = 'La dirección es demasiado larga para un QR.'; return false; }
  };
  url.addEventListener('input', dibujar);
  c.append(h('div', { class: 'card' }, h('h2', {}, 'Código QR del examen'),
    h('p', { class: 'sub' }, 'Un solo QR para toda la planta: cada persona escribe su número de empleado y el sistema le asigna el examen de su máquina.'),
    h('label', { class: 'f' }, 'Dirección web del examen'), url,
    h('label', { class: 'f' }, 'Texto del póster'), titulo, msg,
    h('div', { style: 'margin:12px 0' }, cv),
    h('div', { class: 'row' },
      h('button', { class: 'btn', onclick: () => { if (dibujar()) { DATA.urlPublica = url.value.trim(); DATA.tituloQR = titulo.value; guardar(); bajar('QR_examen.png', cv.toDataURL('image/png'), 'image/png'); } } }, 'Descargar QR (PNG)'),
      h('button', { class: 'btn ghost', onclick: () => {
        if (!dibujar()) return; DATA.urlPublica = url.value.trim(); DATA.tituloQR = titulo.value; guardar();
        const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
        const w = window.open('', '_blank'); if (!w) { alert('El navegador bloqueó la ventana. Permite ventanas emergentes para imprimir.'); return; }
        w.document.write(`<!doctype html><meta charset="utf-8"><title>Póster QR</title><style>@page{size:letter;margin:14mm}body{font-family:system-ui,Arial,sans-serif;text-align:center}h1{font-size:44px;margin:30px 0 6px;color:#1F3864}p{font-size:22px;margin:10px}img{width:520px;height:520px}.u{font-size:15px;color:#555;word-break:break-all}</style><h1>${esc(titulo.value)}</h1><p>Escanea el código con la cámara de tu celular</p><img src="${cv.toDataURL('image/png')}"><p><b>Ten a la mano tu número de empleado</b></p><p class="u">${esc(url.value)}</p><script>onload=function(){setTimeout(function(){print()},300)}<\/script>`); w.document.close();
      } }, 'Imprimir póster'))));
  dibujar();
}

function revisar() {
  let n = 0; B().forEach(b => b.habilidades.forEach(hb => hb.preguntas.forEach(q => { if (!q.q.trim() && !q.img) n++; if (q.opts.some(o => !o.t.trim() && !o.img)) n++; })));
  if (n) return confirm(`Hay ${n} pregunta(s) con texto u opciones vacías en ${act}. ¿Continuar de todas formas?`);
  return true;
}
function descargarHTML() {
  const clon = document.documentElement.cloneNode(true);
  clon.querySelector('#app').innerHTML = '';
  clon.querySelector('#lightbox img').removeAttribute('src'); clon.querySelector('#lightbox').setAttribute('hidden', '');
  clon.querySelector('#datos').textContent = JSON.stringify(DATA).replace(/</g, '\\u003c');
  bajar('index.html', '<!DOCTYPE html>\n' + clon.outerHTML, 'text/html');
}
function importarJSON() {
  const i = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none', onchange: e => {
    const f = e.target.files[0]; if (!f) return; const fr = new FileReader();
    fr.onload = () => { try { const d = JSON.parse(fr.result); if (!d.examenes || !d.areas) throw 0; if (confirm('Esto reemplaza los exámenes y la plantilla actuales. ¿Continuar?')) { DATA = d; act = Object.keys(DATA.examenes)[0]; sel = { t: 'x' }; abrirEditor(true); guardar(); } } catch (x) { alert('El archivo no tiene el formato esperado.'); } };
    fr.readAsText(f); i.remove(); } });
  document.body.append(i); i.click();
}

/* ================= ARRANQUE ================= */
if (location.hash === '#editor') abrirEditor(false); else inicio();
window.addEventListener('hashchange', () => location.reload());
</script>
